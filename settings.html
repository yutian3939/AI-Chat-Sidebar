<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Sidebar - 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <header>
      <svg class="logo" viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
      <h1>AI 对话助手 - 设置</h1>
    </header>

    <div class="card">
      <h2>API 配置</h2>
      <p class="hint">使用 OpenAI 兼容格式，支持任何兼容 OpenAI Chat Completions API 的服务商</p>

      <div class="field">
        <label for="apiEndpoint">API 端点</label>
        <input type="url" id="apiEndpoint" placeholder="https://api.openai.com/v1/chat/completions" spellcheck="false">
        <span class="helper">⚠️ 必须是完整的 chat completions 地址，以 <code>/chat/completions</code> 结尾<br>如果只填 base URL 会自动补全</span>
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <div class="password-wrap">
          <input type="password" id="apiKey" placeholder="sk-..." spellcheck="false">
          <button class="toggle-vis" id="toggleKey" title="显示/隐藏">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="model">模型名称</label>
        <input type="text" id="model" placeholder="gpt-3.5-turbo" spellcheck="false" list="model-list">
        <datalist id="model-list">
          <option value="gpt-4o">
          <option value="gpt-4o-mini">
          <option value="gpt-4-turbo">
          <option value="gpt-3.5-turbo">
          <option value="deepseek-chat">
          <option value="deepseek-coder">
          <option value="qwen-turbo">
          <option value="qwen-plus">
          <option value="glm-4">
          <option value="moonshot-v1-8k">
        </datalist>
      </div>

      <div class="field">
        <label for="systemPrompt">系统提示词</label>
        <textarea id="systemPrompt" rows="4" placeholder="你是一个有帮助的AI助手。"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>外观</h2>
      <div class="field">
        <label for="theme">主题</label>
        <select id="theme">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        保存设置
      </button>
      <button class="btn outline" id="btnTest">
        <svg viewBox="0 0 24 24"><path d="M13 3v2h-2V3H9v2H7v2h2v2H7v2h2v2H7v2h2v2h2v-2h2v2h2v-2h2v-2h-2v-2h2V9h2V7h-2V5h-2v2h-2V5h-2zm-2 8h2v2h-2v-2z"/></svg>
        测试连接
      </button>
    </div>

    <div class="status" id="status"></div>

    <footer>
      <p>兼容 OpenAI / DeepSeek / 通义千问 / GLM / Moonshot 等服务商</p>
    </footer>
  </div>

  <script src="settings.js"></script>
</body>
</html>
